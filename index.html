<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d5a86">
  <meta name="description" content="Ficha de anestesia digital: preenchimento durante o ato anestésico e geração de PDF.">
  <title>Ficha de Anestesia</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="app"></main>
  <nav class="tabs" id="tabs" hidden></nav>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    // Se algo falhar ao abrir o app, mostra o erro na tela (em vez de ficar em branco).
    (function () {
      var erros = [];
      function mostrar() {
        var app = document.getElementById('app');
        if (!app || app.children.length) return;
        app.innerHTML = '<div style="margin:20px;padding:16px;border-radius:12px;background:#fbe5e3;color:#7a1c16;font:15px system-ui">' +
          '<b>O app não conseguiu abrir.</b><br>Tire um print desta tela e envie ao desenvolvedor.<pre style="white-space:pre-wrap;font-size:12px;margin-top:10px">' +
          (erros.join(' | ') || 'Sem mensagem de erro.').replace(/[<&]/g, function (c) { return c === '<' ? '&lt;' : '&amp;'; }) + '</pre></div>';
      }
      window.addEventListener('error', function (e) { erros.push((e.message || 'erro') + ' @ ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || '')); mostrar(); });
      window.addEventListener('unhandledrejection', function (e) { erros.push(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)); mostrar(); });
      setTimeout(mostrar, 6000);
    })();
  </script>
  <script src="lib/jspdf.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
